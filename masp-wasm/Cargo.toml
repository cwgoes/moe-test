[package]
name = "masp-wasm"
version = "0.1.0"
edition = "2021"
description = "MASP proof generation for web browsers"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2.99"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
console_error_panic_hook = { version = "0.1.7", optional = true }
getrandom = { version = "0.2", features = ["js"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
hex = "0.4"

# BLS12-381 and zk-SNARK
bls12_381 = "0.8"
ff = "0.13"
group = "0.13"
rand_core = { version = "0.6", features = ["getrandom"] }
# Disable multicore feature - rayon doesn't work in WASM
bellman = { version = "0.14", default-features = false, features = ["groth16"] }

# Namada MASP circuits
masp_proofs = { version = "3.0", default-features = false, features = ["js"] }
masp_primitives = "3.0"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "z"
lto = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
