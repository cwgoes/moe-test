[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "prague"
via_ir = true
optimizer = true
optimizer_runs = 200

[profile.ci]
fuzz = { runs = 1000 }
verbosity = 4

