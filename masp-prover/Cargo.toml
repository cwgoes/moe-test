[package]
name = "masp-prover"
version = "0.1.0"
edition = "2021"
description = "BLS12-381 Groth16 proof generator for Ethereum verification tests"

[dependencies]
# Core cryptography using bellman with BLS12-381
bellman = "0.14"
bls12_381 = "0.8"
ff = "0.13"
group = "0.13"
rand = "0.8"
rand_core = "0.6"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"

# CLI
clap = { version = "4.0", features = ["derive"] }

# Error handling
anyhow = "1.0"

[profile.release]
opt-level = 3
