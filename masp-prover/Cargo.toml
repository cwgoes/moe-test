[package]
name = "masp-prover"
version = "0.1.0"
edition = "2021"
description = "Groth16 proof generator for Ethereum MASP verifier testing"

[dependencies]
# Groth16 proving system with BLS12-381
bellman = "0.14"
bls12_381 = "0.8"
ff = "0.13"
group = "0.13"

# Serialization
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Randomness
rand = "0.8"
rand_core = "0.6"

[[bin]]
name = "generate-test-vectors"
path = "src/generate_test_vectors.rs"

[[bin]]
name = "verify-format"
path = "src/verify_format.rs"
